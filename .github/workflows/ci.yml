name: ci

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - run: bun install --frozen-lockfile
            - name: Typecheck
              run: bun run typecheck
            - name: Lint
              run: bun run lint
            - name: Format
              run: bun run format:check
            - name: Unit tests
              run: bun run test:unit
            - name: E2E tests
              run: bun run test:e2e
            - name: Migrations match the schema
              run: |
                  bun run db:generate
                  if [ -n "$(git status --porcelain drizzle)" ]; then
                    git status --porcelain drizzle
                    echo "Schema changed without a migration. Run 'bun run db:generate' and commit it."
                    exit 1
                  fi
            - name: openapi.json is current
              run: bun run openapi:check
            - name: Build
              run: bun run build
            - uses: actions/upload-artifact@v4
              with:
                  name: openapi
                  path: openapi.json

    image:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/backend
                  tags: |
                      type=sha,prefix=sha-
                      type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      GIT_SHA=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
